
<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>终端 // 记忆存档</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              mono: ['"JetBrains Mono"', 'monospace'],
              tech: ['"Share Tech Mono"', 'monospace'],
            },
            colors: {
              // Dark Mode Palette
              void: '#050608',
              metal: {
                900: '#0f1218',
                800: '#1a1f29',
                700: '#2d3748',
                600: '#4a5568',
                500: '#64748b',
                400: '#94a3b8',
                300: '#a0aec0',
                200: '#cbd5e0',
                100: '#f1f5f9',
              },
              // Light Mode Palette (Engineering Blueprint)
              paper: '#e8e6e1', // Warm beige background
              concrete: {
                50: '#f2f2f0',  // Lightest panels
                100: '#e6e6e3',
                200: '#dcdcd9', // Elements
                300: '#b8b8b4', // Borders
                600: '#8a8a85', // Darker accents
              },
              ink: {
                900: '#111110', // Primary text (Sharp Black)
                500: '#4a4a48', // Secondary text
                400: '#7d7d7a',
              },
              // Shared Accent
              safety: {
                orange: '#ffaa00',
                dim: '#996600'
              }
            },
            backgroundImage: {
              'noise': "url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.05%22/%3E%3C/svg%3E')",
            }
          }
        }
      }
    </script>
    <style>
      /* ROOT TRANSITION SETUP */
      html {
        background-color: #e8e6e1;
        transition: background-color 30ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      html.dark {
        background-color: #050608;
      }

      body {
        min-height: 100vh;
      }
      
      * {
        transition-property: background-color, border-color, color, fill, stroke, box-shadow !important;
        transition-duration: 30ms !important;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1) !important;
      }

      .scanline::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
        background-size: 100% 4px;
        z-index: 50;
        pointer-events: none;
      }

      .dark ::-webkit-scrollbar {
        width: 12px;
        background: #0f1218;
        border-left: 1px solid #2d3748;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #4a5568;
        border: 2px solid #0f1218;
      }
      
      ::-webkit-scrollbar {
        width: 12px;
        background: #e6e6e3;
        border-left: 1px solid #b8b8b4;
      }
      ::-webkit-scrollbar-thumb {
        background: #8a8a85;
        border: 2px solid #e6e6e3;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ffaa00;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.4"
  }
}
</script>
</head>
<script type="module" src="./index.tsx"></script>
  <body class="bg-paper text-ink-900 dark:bg-void dark:text-metal-300 font-mono antialiased">
    <div id="root" class="min-h-screen w-screen scanline bg-noise relative"></div>
  </body>
</html>
