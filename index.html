<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>终端 // 记忆存档</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              mono: ['"JetBrains Mono"', 'monospace'],
              tech: ['"Share Tech Mono"', 'monospace'],
            },
            colors: {
              /* ================= Dark Mode ================= */
              void: '#050608',
              metal: {
                900: '#0f1218',
                800: '#1a1f29',
                700: '#2d3748',
                600: '#4a5568',
                500: '#64748b',
                400: '#94a3b8',
                300: '#a0aec0',
                200: '#cbd5e0',
                100: '#f1f5f9',
              },

              /* ================= Light Mode ================= */
              paper: '#f1efe9', /* 稍亮但不刺的纸张 */
              concrete: {
                50: '#f5f4f0',
                100: '#ebeae5',
                200: '#deddd7',
                300: '#c2c1bb',
                600: '#8f8e88',
              },
              ink: {
                900: '#1a1a18',
                500: '#4f4f4c',
                400: '#7a7a76',
              },

              /* ================= Accent ================= */
              safety: {
                orange: '#c8742a', /* 稳定、旧化橙 */
                dim: '#8b5a22',
              },
            },

            backgroundImage: {
              noise:
                "url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.05%22/%3E%3C/svg%3E')",
            },
          },
        },
      };
    </script>

    <!-- Global Styles -->
    <style>
      /* ================= Root ================= */
      html {
        background-color: #f1efe9;
        transition: background-color 80ms ease;
      }

      html.dark {
        background-color: #050608;
      }

      body {
        min-height: 100vh;
      }

      * {
        transition-property: background-color, border-color, color, box-shadow;
        transition-duration: 80ms;
        transition-timing-function: ease;
      }

      /* ================= Scanline ================= */
      /* 亮色模式：完全关闭扫描线 */
      .scanline::before {
        display: none;
      }

      /* 暗色模式：CRT 扫描线 */
      .dark .scanline::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 50;
        background: linear-gradient(
          rgba(18, 16, 16, 0) 50%,
          rgba(0, 0, 0, 0.1) 50%
        );
        background-size: 100% 4px;
      }

      /* ================= Noise ================= */
      /* 亮色模式：极弱，仅留纸张颗粒感 */
      .bg-noise {
        opacity: 0.12;
      }

      /* 暗色模式：完整噪点 */
      .dark .bg-noise {
        opacity: 1;
      }

      /* ================= UI 骨架线 ================= */
      html:not(.dark) {
        --ui-border: rgba(0, 0, 0, 0.14);
      }

      /* ================= Scrollbar ================= */
      ::-webkit-scrollbar {
        width: 12px;
        background: #ebeae5;
        border-left: 1px solid #c2c1bb;
      }

      ::-webkit-scrollbar-thumb {
        background: #9a9993;
        border: 2px solid #ebeae5;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #c8742a;
      }

      .dark ::-webkit-scrollbar {
        background: #0f1218;
        border-left: 1px solid #2d3748;
      }

      .dark ::-webkit-scrollbar-thumb {
        background: #4a5568;
        border: 2px solid #0f1218;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
    </style>

    <!-- Import Map -->
    <script type="importmap">
      {
        "imports": {
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "react/": "https://esm.sh/react@^19.2.3/",
          "react": "https://esm.sh/react@^19.2.3",
          "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
          "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.4"
        }
      }
    </script>
  </head>

  <body class="bg-paper text-ink-900 dark:bg-void dark:text-metal-300 font-mono antialiased">
    <div id="root" class="min-h-screen w-screen relative"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
